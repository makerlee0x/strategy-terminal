<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Candle Dodge · STRATEGY Arcade</title>
  <meta name="description" content="Swipe or tap to dodge bear candles and scoop green pumps." />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "ChicagoFLF";
      src: url("https://db.onlinewebfonts.com/t/1a243397695904f6f56e490ffd77a9cb.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/1a243397695904f6f56e490ffd77a9cb.woff") format("woff");
      font-weight: 400; font-style: normal; font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="/arcade/css/arcade.css?v=1" />
</head>
<body>
  <div class="arcade-page" data-theme="light" id="arcade-root">
    <div class="arcade-shell">
      <div class="arcade-topbar">
        <div>
          <div class="arcade-brand">STRATEGY</div>
          <div class="arcade-sub">ARCADE &nbsp;/&nbsp; CANDLE DODGE</div>
        </div>
        <div class="arcade-nav">
          <a class="arcade-chip" href="/arcade">LOBBY</a>
          <a class="arcade-chip" href="/">TERMINAL</a>
          <button type="button" class="arcade-chip" id="theme-toggle" aria-label="Toggle theme">DARK</button>
        </div>
      </div>

      <div class="arcade-bezel">
        <div class="arcade-crt">
          <div class="arcade-screen">
            <div class="arcade-panel">
              <div class="arcade-head">
                <div>
                  <div class="arcade-kicker">GREEN GOOD · RED BAD</div>
                  <div class="arcade-title">Candle Dodge</div>
                  <div class="arcade-desc">Swipe or tap to dodge bear candles and scoop green pumps.</div>
                </div>
              </div>
              <div class="arcade-game-host" id="game-root"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/arcade/js/arcade-lib.js?v=1"></script>
  <script src="/arcade/js/candle-dodge.js?v=1"></script>
  <script>
    (function () {
      var root = document.getElementById("arcade-root");
      var btn = document.getElementById("theme-toggle");
      try {
        var saved = localStorage.getItem("sc-theme");
        if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
      } catch (e) {}
      function sync() {
        btn.textContent = root.getAttribute("data-theme") === "dark" ? "LIGHT" : "DARK";
      }
      sync();
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("sc-theme", next); } catch (e) {}
        sync();
      });
      StrategyArcade.mountCandleDodge(document.getElementById("game-root"));
    })();
  </script>
</body>
</html>
